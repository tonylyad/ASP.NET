services:
  promocode-factory-api:
    container_name: promocode-factory-api
    image: ghcr.io/tonylyad/promocode-factory-api:latest
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PromocodeFactoryDb: Data Source=/app/db/PromoCodeFactoryDb.sqlite
    volumes:
      - db:/app/db

volumes:
  db: